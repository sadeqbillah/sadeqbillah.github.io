<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const list = ["glasses1", "glasses2", "hat1", "hat2", "earring"];
        const visibles = [true, false, false, true, true]; // Default visibility states
        
        // --- 1. Startup & Shutdown Logic ---
        const welcomeScreen = document.querySelector("#welcomeScreen");
        const startButton = document.querySelector("#startButton");
        const stopButton = document.querySelector("#stopButton");
        const sceneEl = document.querySelector("a-scene");

        // Start Logic
        startButton.addEventListener("click", () => {
          welcomeScreen.style.display = "none";
          stopButton.style.display = "block"; // Show the stop button
          
          const mindarFaceSystem = sceneEl.systems["mindar-face-system"];
          if (mindarFaceSystem) {
            mindarFaceSystem.start();
          }
        });

        // Stop Logic
        stopButton.addEventListener("click", () => {
          const mindarFaceSystem = sceneEl.systems["mindar-face-system"];
          if (mindarFaceSystem) {
            mindarFaceSystem.stop(); // Stop tracking and turn off webcam stream
          }
          
          stopButton.style.display = "none";  // Hide the stop button
          welcomeScreen.style.display = "flex"; // Return to initial start screen overlay
        });

        // --- 2. Accessories Toggle Logic ---
        const setVisible = (button, entities, visible) => {
          if (visible) {
            button.classList.add("selected");
          } else {
            button.classList.remove("selected");
          }
          entities.forEach((entity) => {
            entity.setAttribute("visible", visible);
          });
        }

        list.forEach((item, index) => {
          const button = document.querySelector("#" + item);
          const entities = document.querySelectorAll("." + item + "-entity");
          
          // Set initial visibility states
          setVisible(button, entities, visibles[index]);
          
          button.addEventListener('click', () => {
            visibles[index] = !visibles[index];
            setVisible(button, entities, visibles[index]);
          });
        });

        // --- 3. Nose Tracking Checkbox Logic ---
        const noseCheckbox = document.querySelector("#noseCheckbox");
        const noseEntity = document.querySelector(".nose-entity");

        noseCheckbox.addEventListener("change", (e) => {
          noseEntity.setAttribute("visible", e.target.checked);
        });
      });
    </script>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      
      /* Center Start Screen Overlay */
      #welcomeScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(240, 240, 240, 0.95);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #startButton {
        padding: 15px 40px;
        font-size: 1.5rem;
        font-weight: bold;
        background-color: #00ffff;
        color: #333;
        border: 2px solid #333;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.1s ease;
      }

      #startButton:hover {
        transform: scale(1.05);
      }

      /* Stop button floating UI positioning */
      #stopButton {
        display: none; /* Hidden by default until running */
        position: fixed;
        right: 20px;
        top: 20px;
        z-index: 2;
        padding: 12px 25px;
        font-size: 1rem;
        font-weight: bold;
        background-color: #ff4d4d;
        color: white;
        border: 2px solid #333;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
      }

      #stopButton:hover {
        background-color: #ff1a1a;
      }

      .example-container {
        overflow: hidden;
        position: absolute;
        width: 100%;
        height: 100%;
      }

      /* Integrated Control UI panel */
      .options-panel {
        position: fixed;
        left: 20px;
        top: 20px;
        z-index: 2;
        background: rgba(255, 255, 255, 0.85);
        padding: 15px;
        border: 2px solid #333;
        border-radius: 8px;
        max-width: 280px;
      }

      .options-panel p {
        margin-top: 0;
        font-size: 0.9rem;
        font-weight: bold;
        text-align: center;
      }

      .items-row {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .options-panel img {
        border: solid 2px #ccc;
        width: 45px;
        height: 45px;
        object-fit: cover;
        cursor: pointer;
        border-radius: 4px;
      }

      .options-panel img.selected {
        border-color: green;
        box-shadow: 0 0 5px rgba(0, 128, 0, 0.5);
      }

      .checkbox-container {
        border-top: 1px solid #ccc;
        padding-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.9rem;
      }

      .checkbox-container input {
        cursor: pointer;
        width: 16px;
        height: 16px;
      }
    </style>
  </head>
  <body>

    <div id="welcomeScreen">
      <button id="startButton">Start AR Experience</button>
    </div>

    <button id="stopButton">Stop Demo</button>

    <div class="example-container">
      <div class="options-panel">
        <p>AR TRY-ON & NOSE TRACKING</p>
        
        <div class="items-row">
          <img id="hat1" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/hat/thumbnail.png" title="Hat 1"/>
          <img id="hat2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/hat2/thumbnail.png" title="Hat 2"/>
          <img id="glasses1" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/glasses/thumbnail.png" title="Glasses 1"/>
          <img id="glasses2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/glasses2/thumbnail.png" title="Glasses 2"/>
          <img id="earring" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/earring/thumbnail.png" title="Earrings"/>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="noseCheckbox" checked />
          <label desert-select="none" for="noseCheckbox">Enable Nose Tracking (Sphere)</label>
        </div>
      </div>

      <a-scene mindar-face="autoStart: false" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
          <a-asset-item id="headModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
          <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
          <a-asset-item id="glassesModel2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/glasses2/scene.gltf"></a-asset-item>
          <a-asset-item id="hatModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/hat/scene.gltf"></a-asset-item>
          <a-asset-item id="hatModel2" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/hat2/scene.gltf"></a-asset-item>
          <a-asset-item id="earringModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/earring/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>
        
        <a-entity mindar-face-target="anchorIndex: 168">
          <a-gltf-model mindar-face-occluder position="0 -0.3 0.15" rotation="0 0 0" scale="0.065 0.065 0.065" src="#headModel"></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 1">
          <a-sphere class="nose-entity" radius="0.1" material="color: #00ffff; transparent: true; opacity: 0.5" position="0 0 0"></a-sphere>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 10">
          <a-gltf-model rotation="0 0 0" position="0 1.0 -0.5" scale="0.35 0.35 0.35" src="#hatModel" class="hat1-entity" visible="false"></a-gltf-model>
        </a-entity>
        
        <a-entity mindar-face-target="anchorIndex: 10">
          <a-gltf-model rotation="0 0 0" position="0 -0.2 -0.5" scale="0.008 0.008 0.008" src="#hatModel2" class="hat2-entity" visible="false"></a-gltf-model>
        </a-entity>
        
        <a-entity mindar-face-target="anchorIndex: 168">
          <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.01 0.01 0.01" src="#glassesModel" class="glasses1-entity" visible="false"></a-gltf-model>
        </a-entity>
        
        <a-entity mindar-face-target="anchorIndex: 168">
          <a-gltf-model rotation="0 -90 0" position="0 -0.3 0" scale="0.6 0.6 0.6" src="#glassesModel2" class="glasses2-entity" visible="false"></a-gltf-model>
        </a-entity>
        
        <a-entity mindar-face-target="anchorIndex: 127">
          <a-gltf-model rotation="-0.1 0 0" position="0 -0.3 -0.3" scale="0.05 0.05 0.05" src="#earringModel" class="earring-entity" visible="false"></a-gltf-model>
        </a-entity>
        
        <a-entity mindar-face-target="anchorIndex: 356">
          <a-gltf-model rotation="0.1 0 0" position="0 -0.3 -0.3" scale="0.05 0.05 0.05" src="#earringModel" class="earring-entity" visible="false"></a-gltf-model>
        </a-entity>
      </a-scene>
    </div>
  </body>
</html>
